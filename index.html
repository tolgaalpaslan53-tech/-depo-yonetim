<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092747">
  <meta name="description" content="Mahalle Platformu: Türkiye'deki mahallelerin etkinlikleri, duyuruları, ilanları ve dayanışma ağı.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mahalle">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20261110-auto-profiles-v2">

  <style>
    .wedding-section{border:1px solid #dce8df;border-radius:16px;padding:16px;background:#f7fbf7;display:grid;gap:12px;margin-top:4px;min-width:0}
    .wedding-section[hidden]{display:none!important}
    .wedding-section h3,.wedding-section h4,.wedding-detail-panel h3{margin:0;color:#173c2c}
    .wedding-section h4{font-size:15px}
    .wedding-title p{font-size:13px;color:#64748b;margin:5px 0 0}
    .wedding-stage{padding:12px;border:1px solid #e0e8e3;border-radius:12px;background:white;display:grid;gap:10px}
    .wedding-stage h4{margin:0 0 2px}
    .wedding-section .two-col{min-width:0}
    .wedding-section .field{min-width:0}
    .wedding-detail-panel{background:#f7fbf7;border:1px solid #dce8df;border-radius:12px;padding:14px;margin:14px 0}
    .wedding-detail-panel h3{font-size:16px;margin:0 0 12px}
    .wedding-family-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .wedding-family-grid div{display:flex;flex-direction:column;gap:4px;min-width:0}
    .wedding-family-grid span{font-size:12px;color:#64748b}
    .wedding-family-grid strong{font-size:14px;overflow-wrap:anywhere}
    .wedding-program-list{display:grid;gap:10px}
    .wedding-program-card{display:grid;gap:5px;padding:12px;background:white;border:1px solid #e4ede6;border-radius:10px}
    .wedding-program-card div{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0;overflow-wrap:anywhere}
    @media(max-width:480px){.wedding-section{padding:11px}.wedding-section .two-col,.wedding-family-grid{grid-template-columns:1fr}}
  </style>
  <title>Mahalle Platformu</title>
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-logo">⌂</div><strong>Mahalle Platformu</strong><span>Mahallenizle bağlantıda kalın.</span></div></div>
  <noscript>Mahalle Platformu için JavaScript etkin olmalıdır.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <!-- Yeni sürüm: Supabase ayarlarını önbellekten bağımsız yükle -->
  <script src="./config.js?v=20261110-auto-profiles-v2"></script>
  <script>
    // Supabase JS kendisi /rest/v1 ekler. Kullanıcı bu eki yanlışlıkla
    // config.js'ye yapıştırdıysa adresi proje köküne normalleştir.
    (function () {
      var c = window.MAHALLE_CONFIG;
      if (!c || !c.SUPABASE_URL) return;
      try {
        var url = new URL(String(c.SUPABASE_URL).trim());
        if (!/^https?:$/.test(url.protocol)) throw new Error('Geçersiz protokol');
        c.SUPABASE_URL = url.origin;
      } catch (err) {
        console.error('Supabase Project URL geçersiz. Ayarları kontrol edin.');
        c.SUPABASE_URL = '';
      }
    }());
  </script>
  <script src="./app.js?v=20261110-auto-profiles-v2" defer></script>
</body>
</html>
