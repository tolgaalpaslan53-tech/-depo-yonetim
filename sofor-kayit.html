<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKTİVA · Şoför Ön Kayıt</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#eaf2fa;background:linear-gradient(155deg,#10273a 0%,#18394e 48%,#0b1b2a 100%);padding:24px 14px 46px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 8%,#4b859b3a,transparent 38%)}.wrap{position:relative;max-width:520px;margin:18px auto;background:#f8fafc;border:1px solid #ffffff33;border-radius:20px;padding:30px 26px;box-shadow:0 22px 55px #020c1780;color:#182c3d}h1{margin:0;color:#173d52;font-size:25px;letter-spacing:2px;font-weight:800}h2{margin:8px 0 8px;font-size:23px;letter-spacing:-.4px}p{line-height:1.55;color:#56697a;margin:0 0 24px;font-size:14px}label{display:block;font-weight:650;font-size:14px;margin:16px 0 7px;color:#29465a}input{width:100%;border:1px solid #c8d4dd;border-radius:10px;padding:14px 13px;background:#fff;font-size:16px;color:#152d3d;outline:none;transition:border-color .2s,box-shadow .2s}input:focus{border-color:#2a7996;box-shadow:0 0 0 3px #2a799621}input::placeholder{color:#9baab5}button{width:100%;margin-top:23px;padding:16px;background:#145c76;border:0;color:#fff;border-radius:11px;font-weight:750;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.msg{margin-top:16px;line-height:1.5;font-size:14px;color:#1b4c60}.honeypot{position:absolute;left:-9999px}.cf-turnstile{margin-top:22px;min-height:64px}@media(max-width:560px){body{padding:12px 10px 30px}.wrap{margin:8px auto;padding:24px 18px;border-radius:17px}h2{font-size:21px}}
</style></head><body><main class="wrap"><h1>AKTİVA</h1><h2>Şoför Araç Ön Kayıt</h2><p>Depo girişinde araç ön kaydınızı oluşturun. Kayıt, depoya veya perona giriş izni değildir.</p><form id="f"><label>Ad Soyad *</label><input name="driver_name" required maxlength="100" autocomplete="name"><label>Telefon *</label><input name="driver_phone" type="tel" required maxlength="20" inputmode="tel" autocomplete="tel"><label>Araç Plakası *</label><input name="plate" required maxlength="24" autocapitalize="characters"><label>Gönderen Firma *</label><input name="company" required maxlength="120"><label>İrsaliye Numarası *</label><input name="waybill_number" required maxlength="100" placeholder="İrsaliye numarasını giriniz"><label class="honeypot">Bu alanı boş bırakın<input name="website" tabindex="-1" autocomplete="off"></label><div class="cf-turnstile" data-sitekey="0x4AAAAAAFlddpr0EL2vZ8gD"></div><button id="submit">Kaydı Gönder</button></form><div id="msg" class="msg" role="status"></div></main><script src="config.js"></script><script>const form=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Gönderiliyor…';try{const data=Object.fromEntries(new FormData(form));data.turnstile_token=data['cf-turnstile-response']||'';const r=await fetch(MK_CONFIG.url+'/functions/v1/aktiva-qr-on-kayit',{method:'POST',headers:{'Content-Type':'application/json','apikey':MK_CONFIG.key},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Kayıt gönderilemedi');form.reset();window.turnstile?.reset();msg.textContent='Ön kaydınız alındı. Lütfen danışma personelinin yönlendirmesini bekleyiniz.'}catch(err){msg.textContent='Kayıt tamamlanamadı: '+err.message}finally{btn.disabled=false}})</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></body></html>
