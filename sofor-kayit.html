<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKTİVA · Şoför Ön Kayıt</title><style>body{font-family:Arial,sans-serif;background:#f3f6f9;color:#172538;margin:0}.wrap{max-width:500px;margin:25px auto;background:white;border-radius:15px;padding:24px;box-shadow:0 2px 18px #0001}h1{margin:0;font-size:28px}p{line-height:1.5;color:#586778}label{display:block;font-weight:600;margin:18px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #b8c4cf;border-radius:9px;padding:13px;font-size:16px}button{width:100%;margin-top:24px;padding:15px;background:#193a50;border:0;color:white;border-radius:9px;font-weight:bold;font-size:16px}button:disabled{opacity:.5}.msg{margin-top:14px;line-height:1.5}.honeypot{position:absolute;left:-9999px}</style></head><body><main class="wrap"><h1>AKTİVA</h1><h2>Şoför Araç Ön Kayıt</h2><p>Depo girişinde araç ön kaydınızı oluşturun. Kayıt, depoya veya perona giriş izni değildir.</p><form id="f"><label>Ad Soyad *</label><input name="driver_name" required maxlength="100" autocomplete="name"><label>Telefon *</label><input name="driver_phone" type="tel" required maxlength="20" inputmode="tel" autocomplete="tel"><label>Araç Plakası *</label><input name="plate" required maxlength="24" autocapitalize="characters"><label>Gönderen Firma *</label><input name="company" required maxlength="120"><label>İrsaliye Numarası (isteğe bağlı)</label><input name="waybill_number" maxlength="100"><label class="honeypot">Bu alanı boş bırakın<input name="website" tabindex="-1" autocomplete="off"></label><button id="submit">Kaydı Gönder</button></form><div id="msg" class="msg" role="status"></div></main><script src="config.js"></script><script>const form=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Gönderiliyor…';try{const data=Object.fromEntries(new FormData(form));const r=await fetch(MK_CONFIG.url+'/functions/v1/aktiva-qr-on-kayit',{method:'POST',headers:{'Content-Type':'application/json','apikey':MK_CONFIG.key},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Kayıt gönderilemedi');form.reset();msg.textContent='Ön kaydınız alındı. Lütfen danışma personelinin yönlendirmesini bekleyiniz.'}catch(err){msg.textContent='Kayıt tamamlanamadı: '+err.message}finally{btn.disabled=false}})</script></body></html>
